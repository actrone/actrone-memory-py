version: 2

# Every action in .github/workflows is pinned to an exact commit SHA, which stops a
# retagged release from silently changing what runs in CI. The trade-off is that a
# pinned SHA never picks up a security fix on its own, so Dependabot owns bumping them
# (it rewrites the SHA and the trailing `# vX.Y.Z` comment together). Without this,
# pinning would quietly turn into running known-stale actions.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # Runtime dependencies are reviewed one by one: this package is a library, so a
    # bump here lands in every consumer's resolution. Dev tooling can move as a batch.
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
    open-pull-requests-limit: 5
