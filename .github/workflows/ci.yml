name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv pip install --system ruff mypy pydantic pydantic-settings structlog tenacity openai
      - name: Ruff — style and import checks
        run: ruff check src/ tests/
      - name: mypy — strict type checking
        run: mypy src/actrone_memory --strict
      - name: bandit — static security analysis
        run: |
          uv pip install --system bandit
          bandit -r src/ -ll

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv pip install --system -e ".[dev]"
      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit/ \
            --cov=actrone_memory \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.9.2
        ports: ["6333:6333"]
        options: >-
          --health-cmd "curl -sf http://localhost:6333/healthz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv pip install --system -e ".[dev]"
      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ \
            -v \
            --timeout=60
        env:
          ACTRONE_REDIS_URL: redis://localhost:6379
          ACTRONE_QDRANT_URL: http://localhost:6333

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv pip install --system pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --requirement <(uv pip compile pyproject.toml) --strict

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and run test stage
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
