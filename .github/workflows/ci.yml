name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  # The oldest Python the package supports (requires-python), and the one mypy targets
  # (`python_version` in pyproject.toml). Type checks run on it so they see the dependency versions a
  # user on it installs: numpy 2.5 needs Python 3.12 and its stubs use 3.12 syntax, which mypy rejects
  # when targeting 3.11.
  MIN_PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A Python of our own for `uv pip install --system`. Without it uv finds the runner's system
      # Python, which Ubuntu marks externally managed (PEP 668), and every install is refused.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MIN_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"  # pinned, not latest: same uv in CI and in the job that publishes
      # Lint against the project's real dependency set: core, dev and the backend extras. A
      # hand-picked list drifted from pyproject, so mypy could not see prometheus-client or httpx;
      # and without the extras' pins, testcontainers pulls redis 8, whose typing turns needed
      # `type: ignore`s into errors on a version the [redis] extra (<6) never installs.
      - run: uv pip install --system -e ".[dev,redis,qdrant,pgvector]"
      - name: Ruff, style and import checks
        run: ruff check src/ tests/
      - name: mypy, strict type checking
        run: mypy src/actrone_memory --strict
      - name: Type-check docs and CLI recipe examples
        # The guide snippets and every `actrone-memory add` recipe are real example files, type-checked
        # against the installed package (which ships py.typed); an API change that breaks a documented
        # snippet or a recipe fails here.
        run: mypy examples/quickstart.py examples/frameworks examples/use_cases --strict --explicit-package-bases
      - name: bandit, static security analysis
        run: |
          uv pip install --system bandit
          bandit -r src/ -ll
      - name: check-compat, framework version drift gate
        # Fails if pyproject extras / README drift from compatibility.yaml (the SSOT). The full
        # per-version interface-canary matrix runs in compat-matrix.yml (scheduled).
        run: |
          uv pip install --system pyyaml
          python scripts/check_compat.py

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # the Codecov upload proves its identity with OIDC, so no token is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A Python of our own for `uv pip install --system`. Without it uv finds the runner's system
      # Python, which Ubuntu marks externally managed (PEP 668), and every install is refused.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"  # pinned, not latest: same uv in CI and in the job that publishes
      - run: uv pip install --system -e ".[dev,redis,qdrant,pgvector]"
      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit/ \
            --cov=actrone_memory \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v
      - name: Verify extracted snippets are in sync
        run: python scripts/extract_snippets.py --check
      # Codecov rejects tokenless uploads ("Token required"), which left the README badge at
      # "unknown". OIDC needs no stored secret. Pull requests from forks get no OIDC token, so their
      # upload is skipped; fail_ci_if_error stays off so that never fails a contributor's CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          use_oidc: true

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # No container health check: the Qdrant image has neither curl nor wget, so a health command
      # always failed and the job never started. The "Wait for Qdrant" step polls it from the runner.
      qdrant:
        image: qdrant/qdrant:v1.9.2
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A Python of our own for `uv pip install --system`. Without it uv finds the runner's system
      # Python, which Ubuntu marks externally managed (PEP 668), and every install is refused.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"  # pinned, not latest: same uv in CI and in the job that publishes
      - run: uv pip install --system -e ".[dev,redis,qdrant,pgvector]"
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz > /dev/null && exit 0
            sleep 2
          done
          echo "Qdrant was not ready after 60 seconds" >&2
          exit 1
      - name: Run integration tests
        # --no-cov: pyproject's addopts apply the 80% coverage floor to every run, and the integration
        # suite alone covers about half the code. The floor is enforced by the Unit Tests job.
        run: |
          python -m pytest tests/integration/ \
            -v \
            --no-cov \
            --timeout=120
        env:
          ACTRONE_REDIS_URL: redis://localhost:6379
          ACTRONE_QDRANT_URL: http://localhost:6333

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A Python of our own for `uv pip install --system`. Without it uv finds the runner's system
      # Python, which Ubuntu marks externally managed (PEP 668), and every install is refused.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"  # pinned, not latest: same uv in CI and in the job that publishes
      - run: uv pip install --system pip-audit
      - name: Audit base dependencies for known vulnerabilities
        run: pip-audit --requirement <(uv pip compile pyproject.toml) --strict

      # The base set is only what `pip install actrone-memory` pulls. Anyone running the
      # durable backend also installs redis + qdrant-client + openai, so audit that
      # resolution too, otherwise a CVE in a shipped backend dependency passes CI unseen.
      # The framework extras (langchain, crewai, torch, ...) are deliberately excluded:
      # they are user-chosen, resolve slowly, and are not part of this library's own path.
      - name: Audit production-extra dependencies (redis, qdrant, openai)
        run: |
          pip-audit --strict --requirement <(
            uv pip compile --extra redis --extra qdrant --extra openai pyproject.toml
          )

  docs:
    name: API Reference (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A Python of our own for `uv pip install --system`. Without it uv finds the runner's system
      # Python, which Ubuntu marks externally managed (PEP 668), and every install is refused.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"  # pinned, not latest: same uv in CI and in the job that publishes
      # Adapters lazily import their frameworks (try/except ImportError), so autodoc needs only the
      # base package + docs tooling. A broken doc-comment / import / RST failure fails the Sphinx build.
      - run: uv pip install --system -e ".[docs]"
      - name: Generate API reference
        run: |
          sphinx-apidoc -o docs/reference src/actrone_memory -f -e
          sphinx-build -b html docs docs/_build/html
