name: "CodeQL"

# GitHub's semantic SAST: deeper taint/dataflow analysis than ruff/bandit (ci.yml), which are
# pattern-based linters. Complementary, not redundant: this catches bug classes (e.g. tainted
# data flowing from an untrusted source into a sink) that pattern matching alone misses. Free for
# public repositories.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push: new CodeQL query packs land continuously, so a repo with
    # no commits in a given week still gets scanned against the latest rules.
    - cron: "30 3 * * 1"

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the repo's Security tab
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          languages: python
          build-mode: none # Python is interpreted, no compile step for the extractor to hook

      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          category: "/language:python"
