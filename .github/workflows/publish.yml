name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing — no API token needed
      contents: write  # create the GitHub Release for this tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Run CI checks before publish
        run: |
          uv pip install --system -e ".[dev]"
          python -m pytest tests/unit/ --cov-fail-under=80 -q
      - name: Build distribution
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        # Publishing to PyPI on a tag push was previously the only artifact of a release: no
        # GitHub Release object, so the repo's Releases tab stayed empty and there was nowhere to
        # read what changed between versions without diffing CHANGELOG.md by hand. Auto-generated
        # notes (from merged PRs since the previous tag) need no extra maintenance.
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }} # SemVer pre-release suffix, e.g. v1.0.0-rc.1
