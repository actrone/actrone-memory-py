    packages: [dspy-ai]
    floor: "2.4"
    cap: "3"
    matrix: { floor: "2.4.0", current: "2.6", next: "3.0" }
    readme: DSPy
    contract: []
  agno:
    extra: agno
    packages: [agno]
    floor: "1.0"
    cap: "2"
    matrix: { floor: "1.0.0", current: "1.1", next: "2.0" }
    readme: Agno
    contract: []
  smolagents:
    extra: smolagents
    packages: [smolagents]
    floor: "1.0"
    cap: "2"
    matrix: { floor: "1.0.0", current: "1.14", next: "2.0" }
    readme: smolagents
    contract: []
  aws_strands:
    extra: strands
    packages: [strands-agents]
    floor: "1.0"
    cap: "2"
    matrix: { floor: "1.0.0", current: "1.1", next: "2.0" }
    readme: AWS Strands
    contract: []
  openai_agents:
    extra: openai_agents
    packages: [openai-agents]
    floor: "0.1"
    cap: "1"
    matrix: { floor: "0.1.0", current: "0.2", next: "0.3" }
    readme: OpenAI Agents SDK
    contract: []
  pydantic_ai:
    extra: pydantic_ai
    packages: [pydantic-ai]
    floor: "0.4"
    cap: "2"
    matrix: { floor: "0.4.0", current: "0.9", next: "1.0" }
    readme: Pydantic AI
    contract: []
  claude_agent_sdk:
    extra: claude_agent_sdk
    packages: [claude-agent-sdk]
    floor: "0.1"
    cap: "1"
