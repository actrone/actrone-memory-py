# Framework compatibility, SINGLE SOURCE OF TRUTH.
#
# This file is authoritative for three things that used to drift as hand-maintained copies:
#   1. the `[project.optional-dependencies]` extra ranges in pyproject.toml,
#   2. the framework compatibility matrix in README.md, and
#   3. the version matrix the compat-matrix CI job tests (floor / current / next).
#
# `scripts/check_compat.py` fails CI if pyproject or the README drift from this file, so "declared"
# is generated from "tested". The `.github/workflows/compat-matrix.yml` job reads `matrix:` to test
# each framework, in isolation, at its range boundaries against the REAL SDK.
#
# Per framework:
#   extra:    the pyproject optional-dependency key (`pip install actrone-memory[<extra>]`)
#   packages: the pip distributions the extra installs
#   floor:    oldest supported minor (the `>=floor` in the extra spec)
#   cap:      exclusive upper bound (the `<cap` in the extra spec)
#   matrix:   versions the CI job installs+tests: floor pin, current (latest in range), next (pre/next-major, warn-only)
#   readme:   the label used in the README compatibility matrix row
#   contract: the stable public symbols the adapter binds to (asserted by interface-canary tests)
schema: 1

frameworks:
  langchain:
    extra: langchain
    # Spans both majors on purpose. LangChain REMOVED `langchain_core.memory` in 1.x, retiring
    # the BaseMemory abstraction, so there is no 1.x interface to port ActroneMemory onto. The
    # previous `<1` cap therefore held users on a 0.3.x line whose published advisories are only
    # fixed in 1.x. `langchain_core.chat_history:BaseChatMessageHistory` is byte-identical across
    # both majors, so ActroneChatMessageHistory is the Tier-2 surface that spans them, and
    # ActroneMemory raises a version-specific error on 1.x. The contract below deliberately names
    # only the interface that exists in BOTH lines; do NOT add a BaseMemory canary back.
    packages: [langchain, langchain-core]
    floor: "0.2"
    cap: "3"
    matrix: { floor: "0.2.0", current: "1.3", next: "2.0" }
    readme: LangChain
    contract: ["langchain_core.chat_history:BaseChatMessageHistory"]
  langgraph:
    extra: langgraph
    packages: [langgraph]
    floor: "0.1"
    cap: "2"
    matrix: { floor: "0.1.0", current: "0.2", next: "1.0" }
    readme: LangGraph
    contract: []
  crewai:
    extra: crewai
    packages: [crewai]
    floor: "0.30"
    cap: "2"
    matrix: { floor: "0.30.0", current: "0.86", next: "1.0" }
    readme: CrewAI
    contract: []
  autogen:
    extra: autogen
    packages: [autogen-agentchat, autogen-core]
    floor: "0.4"
    cap: "1"
    matrix: { floor: "0.4.0", current: "0.5", next: "0.7" }
    readme: AutoGen
    contract: []
  llamaindex:
    extra: llamaindex
    packages: [llama-index-core]
    floor: "0.10"
    cap: "2"
    matrix: { floor: "0.10.0", current: "0.12", next: "1.0" }
