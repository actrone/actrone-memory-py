    matrix: { floor: "1.0.0", current: "1.20", next: "2.0" }
    readme: Semantic Kernel
    contract: ["semantic_kernel.contents:ChatHistory"]
  google_adk:
    extra: google_adk
    packages: [google-adk]
    floor: "1.0"
    cap: "2"
    matrix: { floor: "1.0.0", current: "1.5", next: "2.0" }
