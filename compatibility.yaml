# Infra / non-framework extras, deliberately NOT in the matrix (kept in sync by the drift gate's
# exclude list so an unexpected new extra is flagged).
# Backend/tooling extras, not agent frameworks: no interface canary or version matrix applies.
non_framework_extras:
  [redis, qdrant, pgvector, openai, onnx, production, local, all, dev, docs]
