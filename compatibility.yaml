# Framework compatibility, SINGLE SOURCE OF TRUTH.
#
# This file is authoritative for three things that used to drift as hand-maintained copies:
#   1. the `[project.optional-dependencies]` extra ranges in pyproject.toml,
#   2. the framework compatibility matrix in README.md, and
#   3. the version matrix the compat-matrix CI job tests (floor / current / next).
#
# `scripts/check_compat.py` fails CI if pyproject or the README drift from this file, so "declared"
# is generated from "tested". The `.github/workflows/compat-matrix.yml` job reads `matrix:` to test
# each framework, in isolation, at its range boundaries against the REAL SDK.
#
# Per framework:
#   extra:    the pyproject optional-dependency key (`pip install actrone-memory[<extra>]`)
#   packages: the pip distributions the extra installs
#   floor:    oldest supported minor (the `>=floor` in the extra spec)
#   cap:      exclusive upper bound (the `<cap` in the extra spec)
#   matrix:   versions the CI job installs+tests: floor pin, current (latest in range), next (pre/next-major, warn-only)
#   readme:   the label used in the README compatibility matrix row
#   contract: the stable public symbols the adapter binds to (asserted by interface-canary tests)
schema: 1

frameworks:
  langchain:
    extra: langchain
    # Spans both majors on purpose. LangChain REMOVED `langchain_core.memory` in 1.x, retiring
    # the BaseMemory abstraction, so there is no 1.x interface to port ActroneMemory onto. The
    # previous `<1` cap therefore held users on a 0.3.x line whose published advisories are only
    # fixed in 1.x. `langchain_core.chat_history:BaseChatMessageHistory` is byte-identical across
    # both majors, so ActroneChatMessageHistory is the Tier-2 surface that spans them, and
    # ActroneMemory raises a version-specific error on 1.x. The contract below deliberately names
    # only the interface that exists in BOTH lines; do NOT add a BaseMemory canary back.
    packages: [langchain, langchain-core]
    floor: "0.2"
    cap: "3"
    matrix: { floor: "0.2.0", current: "1.3", next: "3.0" }
    readme: LangChain
    contract:
      - "langchain_core.chat_history:BaseChatMessageHistory"
      - "langchain_core.messages:AIMessage"
      - "langchain_core.messages:HumanMessage"
      - "langchain_core.runnables.history:RunnableWithMessageHistory"
  langgraph:
    extra: langgraph
    packages: [langgraph]
    # langgraph 0.1.0 was never published; 0.1.1 is the first release.
    floor: "0.1"
    cap: "2"
    matrix: { floor: "0.1.1", current: "0.2", next: "2.0" }
    readme: LangGraph
    contract:
      - "langgraph.checkpoint.base:BaseCheckpointSaver"
      - "langgraph.checkpoint.memory:MemorySaver"
      - "langgraph.graph:StateGraph"
      - "langgraph.graph.message:add_messages"
  crewai:
    extra: crewai
    packages: [crewai]
    # Releases before 0.95 import pkg_resources (setuptools) without declaring it, so they fail
    # to import in a fresh Python 3.12 environment.
    floor: "0.95"
    cap: "2"
    matrix: { floor: "0.95.0", current: "0.95", next: "2.0" }
    readme: CrewAI
    contract:
      - "crewai:Agent"
      - "crewai:Task"
      - "crewai:Crew"
  autogen:
    extra: autogen
    packages: [autogen-agentchat, autogen-core]
    # 0.4.0 and 0.4.1 were yanked (an accidental GPL dependency) and 0.4.2 has no
    # `autogen_core.memory`; 0.4.3 is the first release with the Memory API.
    floor: "0.4.3"
    cap: "1"
    matrix: { floor: "0.4.3", current: "0.5", next: "1.0" }
    readme: AutoGen
    contract:
      - "autogen_core.memory:Memory"
      - "autogen_core.memory:MemoryContent(content, mime_type)"
      - "autogen_core.memory:MemoryQueryResult(results)"
      - "autogen_core.memory:UpdateContextResult(memories)"
      - "autogen_core.model_context:ChatCompletionContext"
      - "autogen_agentchat.agents:AssistantAgent(memory)"
  llamaindex:
    extra: llamaindex
    packages: [llama-index-core]
    floor: "0.10"
    cap: "2"
    matrix: { floor: "0.10.0", current: "0.12", next: "2.0" }
    readme: LlamaIndex
    contract:
      - "llama_index.core.chat_engine:SimpleChatEngine"
      - "llama_index.core.base.llms.types:ChatMessage"
      - "llama_index.core.base.llms.types:MessageRole"
  haystack:
    extra: haystack
    packages: [haystack-ai]
    floor: "2.0"
    # 3.x verified 2026-10-01 (3.2.0): the component and Pipeline APIs the adapter uses are unchanged.
    cap: "4"
    matrix: { floor: "2.0.0", current: "2.9", next: "4.0" }
    readme: Haystack
    contract:
      - "haystack:component"
      - "haystack:Pipeline"
      - "haystack.dataclasses:Document"
  dspy:
    extra: dspy
    packages: [dspy]
    # The `dspy` package, not `dspy-ai`: dspy-ai is now only an alias that requires an
    # unbounded `dspy`, so a `dspy-ai<3` range still installed DSPy 3.x. 2.5.1 is the first
    # real `dspy` release.
    floor: "2.5"
    cap: "4"
    matrix: { floor: "2.5.1", current: "3.0", next: "4.0" }
    readme: DSPy
    contract:
      - "dspy:Retrieve(k)"
      - "dspy:settings"
  agno:
    extra: agno
    packages: [agno]
    floor: "1.0"
    # 2.x (2.9.0) and 3.x (3.0.11) verified 2026-10-01: `Agent(additional_context=...)` is unchanged.
    cap: "4"
    matrix: { floor: "1.0.0", current: "1.1", next: "4.0" }
    readme: Agno
    contract:
      - "agno.agent:Agent(model, additional_context)"
  smolagents:
    extra: smolagents
    packages: [smolagents]
    # 1.0.0 through 1.5.0 fail with current dependencies; 1.5.1 is the first that works.
    floor: "1.5.1"
    cap: "2"
    matrix: { floor: "1.5.1", current: "1.14", next: "2.0" }
    readme: smolagents
    contract:
      - "smolagents:CodeAgent(tools, model)"
      - "smolagents:CodeAgent.run(task)"
  aws_strands:
    extra: strands
    packages: [strands-agents]
    floor: "1.0"
    cap: "2"
    matrix: { floor: "1.0.0", current: "1.1", next: "2.0" }
    readme: AWS Strands
    contract:
      - "strands:Agent(model, system_prompt)"
  openai_agents:
    extra: openai_agents
    packages: [openai-agents]
    # 0.1.x builds usage records the current `openai` SDK rejects (InputTokensDetails now
    # requires cache_write_tokens), so every run fails; 0.2.0 is the first that works.
    floor: "0.2"
    cap: "1"
    matrix: { floor: "0.2.0", current: "0.2", next: "1.0" }
    readme: OpenAI Agents SDK
    contract:
      - "agents:Agent(name, instructions)"
      - "agents:Runner.run(starting_agent, input)"
  pydantic_ai:
    extra: pydantic_ai
    packages: [pydantic-ai]
    # Releases before 1.32 import `opentelemetry._events`, which current OpenTelemetry
    # removed, so they fail to import today.
    floor: "1.32"
    # 2.x verified 2026-10-01 (2.52.0): dynamic `@agent.system_prompt` and `RunContext` are unchanged.
    cap: "3"
    matrix: { floor: "1.32.0", current: "1.32", next: "3.0" }
    readme: Pydantic AI
    contract:
      - "pydantic_ai:Agent(deps_type)"
      - "pydantic_ai:Agent.system_prompt"
      - "pydantic_ai:RunContext"
  claude_agent_sdk:
    extra: claude_agent_sdk
    packages: [claude-agent-sdk]
    floor: "0.1"
    cap: "1"
    matrix: { floor: "0.1.0", current: "0.2", next: "1.0" }
    readme: Claude Agent SDK
    contract:
      - "claude_agent_sdk:ClaudeAgentOptions(system_prompt)"
      - "claude_agent_sdk:query(prompt, options)"
  semantic_kernel:
    extra: semantic_kernel
    packages: [semantic-kernel]
    # Releases before 1.16 import `pydantic.networks.Url`, which current Pydantic removed.
    floor: "1.16"
    cap: "2"
    matrix: { floor: "1.16.0", current: "1.20", next: "2.0" }
    readme: Semantic Kernel
    contract:
      - "semantic_kernel.contents:ChatHistory"
      - "semantic_kernel.contents:ChatHistory.add_system_message"
  google_adk:
    extra: google_adk
    packages: [google-adk]
    # 1.0 and 1.1 import `deprecated` without declaring it, so they fail to import.
    floor: "1.2"
    # 2.x verified 2026-10-01 (2.10.0): `BaseMemoryService`, `SearchMemoryResponse` and `MemoryEntry` are unchanged.
    cap: "3"
    matrix: { floor: "1.2.0", current: "1.5", next: "3.0" }
    readme: Google ADK
    contract:
      - "google.adk.memory:BaseMemoryService"
      - "google.adk.memory.base_memory_service:SearchMemoryResponse(memories)"
      - "google.adk.memory.memory_entry:MemoryEntry(content, author, timestamp)"
      - "google.adk.runners:Runner(agent, app_name, memory_service)"
  microsoft_agent_framework:
    extra: microsoft_agent_framework
    packages: [agent-framework-core]
    floor: "1.0"
    cap: "2"
    matrix: { floor: "1.0.0", current: "1.0", next: "2.0" }
    readme: Microsoft Agent Framework
    # Agent Framework 1.x provider API (stable from 1.0.0). The pre-1.0 preview `Context` return type
    # and `invoking`/`invoked` hooks were removed at 1.0; the adapter targets `before_run`/`after_run`.
    contract:
      - "agent_framework:ContextProvider(source_id)"
      - "agent_framework:ContextProvider.before_run"
      - "agent_framework:ContextProvider.after_run"
      - "agent_framework:SessionContext.extend_instructions"
      - "agent_framework:Agent(context_providers)"

# Infra / non-framework extras, deliberately NOT in the matrix (kept in sync by the drift gate's
# exclude list so an unexpected new extra is flagged).
# Backend/tooling extras, not agent frameworks: no interface canary or version matrix applies.
non_framework_extras:
  [redis, qdrant, pgvector, openai, onnx, production, local, tiktoken, all, dev, docs]
