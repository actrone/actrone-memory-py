[project]
name = "actrone-memory"
version = "0.2.0"
description = "Production-grade two-tier persistent memory for AI agents — Redis L1 + Qdrant L2"
readme = "README.md"
license = "MIT"                    # PEP 639 SPDX expression
license-files = ["LICENSE"]
authors = [{ name = "Actrone", email = "hello@actrone.com" }]
keywords = [
    "ai", "agents", "memory", "langchain", "langgraph", "crewai",
    "autogen", "llamaindex", "haystack", "dspy", "qdrant", "redis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "redis[hiredis]>=5.0,<6",
    "qdrant-client>=1.9,<2",
    "openai>=1.30,<2",
    "structlog>=24.1,<25",
    "tiktoken>=0.7,<1",
    "tenacity>=8.3,<10",
    "prometheus-client>=0.20,<1",
    # Pinned explicitly per CLAUDE.md §1.5 — pydantic + structlog both pull it
    # transitively and the API surface (NotRequired, Self, TypeAliasType) is
    # load-bearing for our type annotations.
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
langchain   = ["langchain>=0.2,<1", "langchain-core>=0.2,<1"]
langgraph   = ["langgraph>=0.1,<1"]
crewai      = ["crewai>=0.30,<1"]
autogen     = ["autogen-agentchat>=0.4,<1", "autogen-core>=0.4,<1"]
llamaindex  = ["llama-index-core>=0.10,<1"]
haystack    = ["haystack-ai>=2.0,<3"]
dspy        = ["dspy-ai>=2.4,<3"]
local       = ["sentence-transformers>=3.0,<4", "torch>=2.3"]
all = [
    "actrone-memory[langchain]",
    "actrone-memory[langgraph]",
    "actrone-memory[crewai]",
    "actrone-memory[autogen]",
    "actrone-memory[llamaindex]",
    "actrone-memory[haystack]",
    "actrone-memory[dspy]",
    "actrone-memory[local]",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "ruff>=0.4,<1",
    "testcontainers[redis,qdrant]>=4.7,<5",
    "httpx>=0.27,<1",
    "respx>=0.21,<1",
    "bandit>=1.7,<2",
]
# API-reference generation (Public-Domain Cutover Runbook Phase 6, item 4). Sphinx autodoc renders the
# reference from the package source. Build: `sphinx-build -b html docs docs/_build/html`.
docs = [
    "sphinx>=9,<10",
    "furo>=2025.12",
]

[project.urls]
Homepage = "https://actrone.com"
Repository = "https://github.com/actrone/actrone-memory-py"
Documentation = "https://docs.actrone.com/memory"
Issues = "https://github.com/actrone/actrone-memory-py/issues"
Changelog = "https://github.com/actrone/actrone-memory-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"] # >=1.27 for PEP 639 SPDX license + license-files support
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actrone_memory"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ASYNC", "S", "B", "A", "C4", "RET", "SIM", "TCH", "PTH"]
# S101 — allow assert in tests.
# A002 — integration adapters mirror upstream framework signatures (e.g. LlamaIndex
#        `input`); renaming would break drop-in compatibility.
# TC001/TC002/TC003 — pydantic v2 resolves annotations at runtime (model_validate),
#        so hoisting typing imports into a TYPE_CHECKING block breaks validation.
ignore = ["S101", "A002", "TC001", "TC002", "TC003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Optional integration packages (langchain, langgraph, crewai, etc.) ship
# their own stubs but are not installed in the base venv. Suppress
# import-not-found for the integration adapters that live behind the
# optional-dependency gate. The adapters themselves are type-annotated so
# the rest of the codebase benefits from strict checking even here.
[[tool.mypy.overrides]]
module = [
    "actrone_memory.integrations.*",
    "langchain_core.*",
    "langgraph.*",
    "crewai.*",
    "autogen_core.*",
    "haystack.*",
    "dspy.*",
    "llama_index.*",
    "sentence_transformers.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=actrone_memory --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: tests that require external services (Redis, Qdrant) via testcontainers",
]

[tool.coverage.run]
source = ["src/actrone_memory"]
# Integration adapters ship their own test suites per-framework (e.g.
# langchain contract tests). Exclude from unit coverage so the threshold
# measures the core library, not framework glue.
omit = ["*/integrations/*"]
